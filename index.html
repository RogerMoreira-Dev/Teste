<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPU Floating 3D</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a2f3a,#0b0d12);overflow:hidden;perspective:1200px}
.stage{position:relative;animation:float 4s ease-in-out infinite}
.card{width:min(80vw,720px);transform-style:preserve-3d;transition:transform .15s ease-out}
.card img{width:100%;display:block;mix-blend-mode:multiply;filter:drop-shadow(0 30px 25px rgba(0,0,0,.6));border-radius:12px;background:#fff}
.shadow{position:absolute;left:15%;right:15%;bottom:-60px;height:30px;background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 70%);animation:shadow 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(.8);opacity:.4}}
</style>
</head>
<body>
<div class="stage"><div class="card" id="c"><img src="gpu.webp" alt="ASUS Prime GPU"></div><div class="shadow"></div></div>
<script>
const c=document.getElementById('c');
addEventListener('pointermove',e=>{const x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;c.style.transform=`rotateY(${x*30}deg) rotateX(${-y*20}deg)`});
addEventListener('pointerleave',()=>c.style.transform='');
</script>
</body>
</html>
