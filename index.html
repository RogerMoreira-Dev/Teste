<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPU Floating 3D</title>
<style>
html,body{touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#2a2f3a,#0b0d12);overflow:hidden}
.stage{position:relative;perspective:1200px;animation:float 4s ease-in-out infinite}
.card{width:min(80vw,720px);transform-style:preserve-3d;cursor:grab;user-select:none}
.card img{width:100%;display:block;mix-blend-mode:multiply;filter:drop-shadow(0 30px 25px rgba(0,0,0,.6));border-radius:12px;background:#fff}
.shadow{position:absolute;left:15%;right:15%;bottom:-60px;height:30px;background:radial-gradient(ellipse,rgba(0,0,0,.7),transparent 70%);animation:shadow 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-25px)}}
@keyframes shadow{0%,100%{transform:scale(1);opacity:.8}50%{transform:scale(.8);opacity:.4}}
</style>
</head>
<body>
<div class="stage"><div class="card" id="c"><img draggable="false" src="gpu.webp" alt="ASUS Prime GPU"></div><div class="shadow"></div></div>
<script>
const c=document.getElementById('c');
let rx=0,ry=0,vx=0,vy=0,drag=false,lx=0,ly=0,lt=0;
const start=(x,y)=>{drag=true;lx=x;ly=y;lt=performance.now();vx=vy=0};
const move=(x,y)=>{if(!drag)return;const now=performance.now(),dx=x-lx,dy=y-ly,dt=Math.max(now-lt,1);
ry+=dx*.5;rx-=dy*.5;vy=dx*.5/dt*16;vx=-dy*.5/dt*16;lx=x;ly=y;lt=now};
const end=()=>{if(performance.now()-lt>100)vx=vy=0;drag=false};
const opt={passive:false};
document.addEventListener('touchstart',e=>{e.preventDefault();start(e.touches[0].clientX,e.touches[0].clientY)},opt);
document.addEventListener('touchmove',e=>{e.preventDefault();move(e.touches[0].clientX,e.touches[0].clientY)},opt);
document.addEventListener('touchend',end);document.addEventListener('touchcancel',end);
document.addEventListener('gesturestart',e=>e.preventDefault(),opt);
document.addEventListener('mousedown',e=>{e.preventDefault();start(e.clientX,e.clientY)});
addEventListener('mousemove',e=>move(e.clientX,e.clientY));
addEventListener('mouseup',end);
(function loop(){if(!drag){ry+=vy;rx+=vx;vy*=.95;vx*=.95;if(Math.abs(vx)+Math.abs(vy)<.05)rx*=.95}
c.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg)`;requestAnimationFrame(loop)})();
</script>
</body>
</html>
